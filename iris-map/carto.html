<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRIS MAP</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#f6f5f2;--panel:#ffffff;--ink:#1d2330;--dim:#5f6475;--line:#e3e1db;--accent2:#2f5d8a;--ok:#2e7d4f;--ko:#a33a3a;--p1:#b3261e;--p2:#e07a2f;--p3:#c9a227}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--panel:#1c2028;--ink:#e8e9ec;--dim:#9aa0ad;--line:#2c313b;--accent2:#6d9fd0;--ok:#5cb784;--ko:#d77272}}
:root[data-theme="dark"]{--bg:#14171d;--panel:#1c2028;--ink:#e8e9ec;--dim:#9aa0ad;--line:#2c313b;--accent2:#6d9fd0;--ok:#5cb784;--ko:#d77272}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}
#side{width:380px;min-width:380px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .2s}
#side.ferme{margin-left:-380px}
#map{flex:1;position:relative}
.hd{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.hd h1{font-size:1.4rem;font-weight:700;margin:0;line-height:1.2}
.hd h1 a{color:var(--ink);text-decoration:none}
.hd h1 a:hover{opacity:.8}
.hd h1 .b{color:#5b9bd5;font-weight:400}
.hd h1 .sep{opacity:.45;font-weight:400;margin:0 2px}
.hd .sub{color:var(--dim);font-size:11px}
.ctl{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctl .full{grid-column:1/3}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%}
button{cursor:pointer;background:var(--panel)}
button.pri{background:var(--accent2);color:#fff;border-color:var(--accent2)}
label.chk{display:flex;gap:6px;align-items:center;font-size:12px}
label.chk input{width:auto}
.lbl{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
#res-hd{padding:8px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line)}
#res-hd button{width:auto;padding:3px 8px;font-size:12px}
#res{overflow:auto;flex:1}
.row{padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start}
.row:hover{background:var(--bg)}
.pb{display:inline-block;min-width:26px;text-align:center;color:#fff;border-radius:4px;font-weight:700;font-size:11px;padding:1px 0}
.row .t{font-weight:600}
.row .m{color:var(--dim);font-size:11px}
.row .s{text-align:right;white-space:nowrap;font-size:12px}
.st{display:inline-block;font-size:10.5px;border:1px solid var(--line);border-radius:8px;padding:0 6px;margin-top:2px}
#toggle{position:absolute;top:10px;left:10px;z-index:3;width:auto;padding:5px 9px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#search{position:absolute;top:10px;left:50px;z-index:3;width:300px;max-width:calc(100% - 120px)}
#search input{box-shadow:0 2px 8px rgba(0,0,0,.15);background:var(--panel)}
#sugg{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:2px;display:none}
#sugg div{padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--line)}
#sugg div:hover{background:var(--bg)}
#layers{position:absolute;top:10px;right:10px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px}
#layers{max-height:calc(100% - 80px);overflow:auto;max-width:270px}
#layers details{margin-top:6px;border-top:1px solid var(--line);padding-top:4px}
#layers summary{cursor:pointer;font-weight:600;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
#layers .grp{font-size:10.5px;color:var(--dim);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.05em}
#layers .leg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px}
#zoomhint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px;display:none}
#fiche{position:absolute;top:0;right:0;bottom:0;width:430px;max-width:100%;z-index:4;background:var(--panel);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .2s;padding:14px 18px 40px}
#fiche.open{transform:none}
#fiche .x{position:sticky;top:0;float:right;width:auto;padding:2px 9px;font-size:15px}
#fiche h2{font-size:16px;margin:0 0 2px}
#fiche h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px}
.kv div:nth-child(odd){color:var(--dim)}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:var(--bg);border:1px solid var(--line);margin:0 4px 4px 0}
.tag.ok{color:var(--ok);border-color:var(--ok)} .tag.ko{color:var(--ko);border-color:var(--ko)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t td,table.t th{padding:4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--dim);font-weight:500}
.r{text-align:right!important;white-space:nowrap}
.occ{padding:6px 0;border-bottom:1px solid var(--line)}
.occ .n{font-weight:600}.occ .m{color:var(--dim);font-size:11px}
.suivi{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.suivi .full{grid-column:1/3}
a{color:var(--accent2)}
.tip{font:12px/1.4 system-ui,sans-serif;color:#1d2330}
.maplibregl-popup-content{padding:8px 10px;border-radius:8px}
#msg{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
@media (max-width:760px){#side{position:absolute;z-index:5;height:100%;width:100%;min-width:0}#side.ferme{margin-left:-100%}#search{left:50px;width:auto;right:10px}#layers{top:54px}#fiche{width:100%}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="hd"><h1><a href="index.html" title="Retour au dashboard">IRIS <span class="b">H</span></a> <span class="sep">|</span> <span class="b">MAP</span></h1><div class="sub">Prospection IRIS REP · <span id="stat"></span></div></div>
    <div class="ctl">
      <input class="full" id="q" placeholder="Propriétaire, SIREN, adresse, occupant, NAF, note…">
      <div><div class="lbl">Priorité</div><select id="prio"><option value="1">P1</option><option value="2">P1 et P2</option><option value="3" selected>P1 à P3</option><option value="0">Tous</option></select></div>
      <div><div class="lbl">Suivi</div><select id="statut"><option value="">Tous</option><option value="aucun">Jamais traité</option></select></div>
      <div><div class="lbl">Emprise min m²</div><input id="smin" type="number" value="100" step="50"></div>
      <div><div class="lbl">Emprise max m²</div><input id="smax" type="number" step="50"></div>
      <label class="chk"><input type="checkbox" id="za"> Zone d'activité</label>
      <label class="chk"><input type="checkbox" id="pm"> Propriétaire société</label>
    </div>
    <div id="res-hd"><span id="nb">…</span><span><button id="csv">Export CSV</button></span></div>
    <div id="res"></div>
  </aside>
  <div id="map">
    <button id="toggle" title="Panneau">☰</button>
    <div id="search"><input id="adr" placeholder="Aller à une adresse ou une commune"><div id="sugg"></div></div>
    <div id="layers">
      <div style="margin-bottom:4px"><span class="leg" style="background:var(--p1)"></span>P1 <span class="leg" style="background:var(--p2)"></span>P2 <span class="leg" style="background:var(--p3)"></span>P3 <span class="leg" style="background:#9aa0ad"></span>autre</div>
      <label class="chk"><input type="checkbox" id="l-cad" checked> Cadastre</label>
      <label class="chk"><input type="checkbox" id="l-ortho"> Photo aérienne</label>
      <label class="chk"><input type="checkbox" id="l-ent" checked> Entreprises des locaux d'activité <span class="leg" style="background:#e3121b;border-radius:50%;margin-left:3px"></span></label>
      <label class="chk"><input type="checkbox" id="l-etab"> Toutes les entreprises</label>
      <label class="chk"><input type="checkbox" id="l-zon"> Zonage PLU</label>
      <label class="chk"><input type="checkbox" id="l-rep" checked> Repérages <span class="leg" style="background:#7b2cbf;margin-left:3px"></span></label>
      <details id="pub"><summary>Données publiques</summary><div id="pub-list"></div></details>
    </div>
    <div id="zoomhint">Zoomez pour afficher les bâtiments</div>
    <div id="fiche"><button class="x" onclick="closeFiche()">×</button><div id="fiche-c"></div></div>
  </div>
</div>
<div id="msg"></div>
<script>
const SUPA_URL='https://kkznkuwoxoxvapejzytv.supabase.co';
// Clé publique anon du projet, identique à celle du dashboard (non secrète)
const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtrem5rdXdveG94dmFwZWp6eXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTQxMTksImV4cCI6MjA4ODkzMDExOX0.Nb7N2FpKvm3NMzS6Nhx4qWoqHZW3-Es3JNPgHxkOWcE';
const TOK_KEY='iris_h_tok';
const STATUTS=['À contacter','Contacté','Rendez vous','Mandat vendeur','Mandat recherche','À vendre','Pas vendeur','À revoir','Écarté'];
const PCOL=['#9aa0ad','#b3261e','#e07a2f','#c9a227'];
const EFF={'NN':'non renseigné','00':'0','01':'1 à 2','02':'3 à 5','03':'6 à 9','11':'10 à 19','12':'20 à 49','21':'50 à 99','22':'100 à 199','31':'200 à 249','32':'250 à 499','41':'500 à 999','42':'1000 à 1999','51':'2000 à 4999','52':'5000 à 9999','53':'10000 et plus'};
let tok=null, rows=[], hlIds=[];

const $=id=>document.getElementById(id);
function msg(t,ms){const m=$('msg');m.innerHTML=t||'';m.style.display=t?'block':'none';if(ms)setTimeout(()=>msg(''),ms)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function n0(v){return v==null||v===''?'':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:0})}
function nz(v){return v&&v!=='null'?v:''}

async function auth(){
  let t=null;try{t=JSON.parse(localStorage.getItem(TOK_KEY))}catch(e){}
  if(t&&t.a&&t.e>Date.now()/1000+60){tok=t.a;return true}
  try{const sj=JSON.parse(localStorage.getItem('sb-kkznkuwoxoxvapejzytv-auth-token'));const ss=sj&&(sj.currentSession||sj);
    if(ss&&ss.access_token&&(ss.expires_at||0)>Date.now()/1000+60){tok=ss.access_token;return true}
    if(ss&&ss.refresh_token&&!(t&&t.r))t={r:ss.refresh_token}}catch(e){}
  if(t&&t.r&&SUPA_ANON){
    const r=await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SUPA_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:t.r})});
    if(r.ok){const j=await r.json();tok=j.access_token;try{localStorage.setItem(TOK_KEY,JSON.stringify({a:j.access_token,r:j.refresh_token||'',e:Math.floor(Date.now()/1000)+(j.expires_in||3600)}))}catch(e){}return true}
  }
  return false;
}
const hdr=()=>({'apikey':SUPA_ANON,'Authorization':'Bearer '+tok,'Content-Type':'application/json'});
async function rpc(fn,args,retry){const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:hdr(),body:JSON.stringify(args)});
  if(r.status===401&&!retry){try{localStorage.removeItem(TOK_KEY)}catch(e){};if(await auth())return rpc(fn,args,true);sessionKO();throw new Error('session')}
  if(!r.ok){const tx=await r.text().catch(()=>'');msg('Erreur '+fn+' '+r.status+' '+esc(tx.slice(0,160)),8000);throw new Error(fn+' '+r.status)}return r.json()}
function sessionKO(){msg('Session expirée. <a href="index.html">Se connecter au dashboard</a> puis revenir sur cette page.')}

const ign=(layer,fmt)=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=${fmt}`;
const map=new maplibregl.Map({container:'map',center:[0.7262,47.3897],zoom:14,maxZoom:20,
  transformRequest:(url)=>url.startsWith(SUPA_URL)?{url,headers:{'apikey':SUPA_ANON,'Authorization':'Bearer '+tok,'Accept':'application/vnd.mapbox-vector-tile'}}:{url},
  style:{version:8,sources:{
    plan:{type:'raster',tiles:[ign('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png')],tileSize:256,maxzoom:19,attribution:'© IGN'},
    ortho:{type:'raster',tiles:[ign('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg')],tileSize:256,maxzoom:19},
    cad:{type:'raster',tiles:[ign('CADASTRALPARCELS.PARCELLAIRE_EXPRESS','image/png')],tileSize:256,maxzoom:19}},
  layers:[{id:'plan',type:'raster',source:'plan'},{id:'ortho',type:'raster',source:'ortho',layout:{visibility:'none'}},{id:'cad',type:'raster',source:'cad',paint:{'raster-opacity':.7}}]}});
map.addControl(new maplibregl.NavigationControl(),'bottom-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-left');
const pop=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:8});
let hovered=null;

function addData(){
  map.addSource('t',{type:'vector',tiles:[`${SUPA_URL}/rest/v1/rpc/carto_mvt?z={z}&x={x}&y={y}`],minzoom:12,maxzoom:16,promoteId:{bat:'id',etab:'siret'}});
  map.addLayer({id:'bat-f',type:'fill',source:'t','source-layer':'bat',paint:{
    'fill-color':['match',['get','prio'],1,PCOL[1],2,PCOL[2],3,PCOL[3],PCOL[0]],
    'fill-opacity':['case',['boolean',['feature-state','hover'],false],.95,['>',['get','prio'],0],.72,.22]}});
  map.addLayer({id:'bat-l',type:'line',source:'t','source-layer':'bat',paint:{'line-color':['case',['>',['get','nbprop'],0],'#2f5d8a','#55595f'],'line-width':['case',['>',['get','nbprop'],0],1.4,.4]}});
  map.addLayer({id:'bat-suivi',type:'line',source:'t','source-layer':'bat',filter:['has','statut'],paint:{'line-color':'#111','line-width':2.4,'line-dasharray':[2,1]}});
  map.addLayer({id:'bat-hl',type:'line',source:'t','source-layer':'bat',filter:['in',['get','id'],['literal',[]]],paint:{'line-color':'#00a3ff','line-width':3}});
  map.addLayer({id:'ent',type:'circle',source:'t','source-layer':'ent',paint:{'circle-radius':['interpolate',['linear'],['zoom'],12,2,15,3.5,18,5],'circle-color':'#e3121b','circle-stroke-color':['match',['get','role'],'Propriétaire','#111','#fff'],'circle-stroke-width':['match',['get','role'],'Propriétaire',1.4,.8]}});
  map.on('mousemove','ent',e=>{const p=e.features[0].properties;map.getCanvas().style.cursor='pointer';pop.setLngLat(e.lngLat).setHTML(`<div class="tip"><b>${esc(p.nom)}</b><br>${esc(p.role)}${p.prio?' · bâtiment P'+p.prio:''}${nz(p.naf)?'<br>NAF '+esc(p.naf):''}${nz(p.eff)?' · effectif '+esc(EFF[p.eff]||p.eff):''}${nz(p.siren)?'<br>SIREN '+esc(p.siren):''}</div>`).addTo(map)});
  map.on('mouseleave','ent',()=>{map.getCanvas().style.cursor='';pop.remove()});
  map.on('click','ent',e=>{e.preventDefault();openFiche(e.features[0].properties.bat)});
  map.addLayer({id:'etab',type:'circle',source:'t','source-layer':'etab',layout:{visibility:'none'},paint:{'circle-radius':3.5,'circle-color':['case',['==',['get','etat'],'A'],'#2e7d4f','#a33a3a'],'circle-stroke-color':'#fff','circle-stroke-width':1}});
  map.addLayer({id:'rep-f',type:'fill',source:'t','source-layer':'rep',filter:['==',['geometry-type'],'Polygon'],paint:{'fill-color':'#7b2cbf','fill-opacity':.22}});
  map.addLayer({id:'rep-l',type:'line',source:'t','source-layer':'rep',filter:['==',['geometry-type'],'Polygon'],paint:{'line-color':'#7b2cbf','line-width':2,'line-dasharray':[3,2]}});
  map.addLayer({id:'rep-p',type:'circle',source:'t','source-layer':'rep',filter:['==',['geometry-type'],'Point'],paint:{'circle-radius':7,'circle-color':'#7b2cbf','circle-stroke-color':'#fff','circle-stroke-width':2}});
  ['rep-f','rep-p'].forEach(l=>{
    map.on('click',l,e=>{e.preventDefault();openRep(e.features[0].properties)});
    map.on('mouseenter',l,()=>map.getCanvas().style.cursor='pointer');
    map.on('mouseleave',l,()=>map.getCanvas().style.cursor='');
  });
  map.on('mousemove','bat-f',e=>{
    const f=e.features[0];map.getCanvas().style.cursor='pointer';
    if(hovered!==null)map.setFeatureState({source:'t',sourceLayer:'bat',id:hovered},{hover:false});
    hovered=f.id;map.setFeatureState({source:'t',sourceLayer:'bat',id:hovered},{hover:true});
    const p=f.properties;
    pop.setLngLat(e.lngLat).setHTML(`<div class="tip">${p.prio>0?`<b style="color:${PCOL[p.prio]}">P${p.prio}</b> · ${esc(p.motif)}<br>`:''}<b>${esc(p.usage||'Usage inconnu')}</b> · ${n0(p.emprise)} m² au sol${p.plancher?' · '+n0(p.plancher)+' m² plancher':''}${p.annee?'<br>Construit en '+p.annee:''}${nz(p.prop)?'<br>Propriétaire : '+esc(p.prop)+(p.nbprop>1?' et '+(p.nbprop-1)+' autre(s)':''):''}${nz(p.adresse)?'<br>'+esc(p.adresse):''}${nz(p.statut)?'<br><b>Suivi : '+esc(p.statut)+'</b>':''}</div>`).addTo(map);
  });
  map.on('mouseleave','bat-f',()=>{map.getCanvas().style.cursor='';if(hovered!==null)map.setFeatureState({source:'t',sourceLayer:'bat',id:hovered},{hover:false});hovered=null;pop.remove()});
  map.on('click','bat-f',e=>{if(e.defaultPrevented)return;if(map.queryRenderedFeatures(e.point,{layers:['rep-f','rep-p','ent']}).length)return;openFiche(e.features[0].properties.id)});
  map.on('mousemove','etab',e=>{const p=e.features[0].properties;pop.setLngLat(e.lngLat).setHTML(`<div class="tip"><b>${esc(p.nom)}</b><br>NAF ${esc(p.naf)} · effectif ${esc(EFF[p.eff]||p.eff||'')}<br>${p.etat==='A'?'Actif':'Fermé'}</div>`).addTo(map)});
  map.on('mouseleave','etab',()=>pop.remove());
  map.on('zoomend',()=>{$('zoomhint').style.display=map.getZoom()<12?'block':'none'});
  map.on('error',e=>{const st=e&&e.error&&e.error.status;if(e.sourceId==='t'&&st){if(st===401)sessionKO();else msg('Erreur de chargement des bâtiments '+st,6000)}});
}
function vis(id,on){map.getLayer(id)&&map.setLayoutProperty(id,'visibility',on?'visible':'none')}

// Explorateur
let tq=null;
function filtres(){return{p_q:$('q').value.trim()||null,p_prio_max:+$('prio').value,p_surface_min:+$('smin').value||0,p_surface_max:+$('smax').value||null,p_statut:$('statut').value||null,p_za:$('za').checked?true:null,p_pm:$('pm').checked?true:null,p_limit:1000}}
async function chercher(){
  $('nb').textContent='Recherche…';
  try{rows=await rpc('carto_recherche',filtres())}catch(e){$('nb').textContent='Erreur '+e.message;return}
  $('nb').textContent=`${n0(rows.length)} bâtiment${rows.length>1?'s':''}${rows.length>=1000?' (limite 1000)':''}`;
  $('res').innerHTML=rows.map((r,i)=>`<div class="row" data-i="${i}"><div><span class="pb" style="background:${PCOL[r.prio]}">${r.prio?'P'+r.prio:'·'}</span></div><div><div class="t">${esc(r.proprietaires||r.adresse||r.usage||'Bâtiment')}</div><div class="m">${esc(r.proprietaires?r.adresse||'':'')} ${esc(r.motif||r.usage||'')}</div>${r.statut?`<span class="st">${esc(r.statut)}</span>`:''}</div><div class="s">${n0(r.emprise)} m²<div class="m">${r.annee||''}</div></div></div>`).join('');
  hlIds=rows.map(r=>r.id);
  if(map.getLayer('bat-hl'))map.setFilter('bat-hl',['in',['get','id'],['literal',($('q').value||$('statut').value||$('smax').value)?hlIds:[]]]);
}
function go(){clearTimeout(tq);tq=setTimeout(chercher,300)}
['q','prio','statut','smin','smax','za','pm'].forEach(id=>{$(id).addEventListener('input',go);$(id).addEventListener('change',go)});
$('res').onclick=e=>{const el=e.target.closest('.row');if(!el)return;const r=rows[+el.dataset.i];map.flyTo({center:[r.lon,r.lat],zoom:Math.max(map.getZoom(),17)});openFiche(r.id)};
$('csv').onclick=()=>{
  const cols=['prio','motif','usage','emprise','plancher','annee','adresse','proprietaires','siren','za','statut','notes','contact','action','lat','lon','id'];
  const csv=[cols.join(';')].concat(rows.map(r=>cols.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(';'))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='iris_map_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};
STATUTS.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;$('statut').appendChild(o)});

// Adresse
let ta=null;
$('adr').addEventListener('input',()=>{clearTimeout(ta);const q=$('adr').value.trim();if(q.length<3){$('sugg').style.display='none';return}
  ta=setTimeout(async()=>{try{const j=await (await fetch('https://api-adresse.data.gouv.fr/search/?limit=5&q='+encodeURIComponent(q))).json();
    $('sugg').innerHTML=j.features.map(f=>`<div data-c="${f.geometry.coordinates.join(',')}" data-t="${esc(f.properties.type)}">${esc(f.properties.label)}</div>`).join('');$('sugg').style.display=j.features.length?'block':'none'}catch(e){}},250)});
$('sugg').onclick=e=>{const d=e.target.closest('div[data-c]');if(!d)return;const c=d.dataset.c.split(',').map(Number);map.flyTo({center:c,zoom:d.dataset.t==='municipality'?13:17});$('sugg').style.display='none';$('adr').value=d.textContent};

// Couches publiques (flux officiels, affichés sans import)
const GR='https://mapsref.brgm.fr/wxs/georisques/risques', GPF='https://data.geopf.fr/wms-v/ows';
const PUB=[
 ['Urbanisme','sup','Servitudes d\'utilité publique','wms',GPF],
 ['Urbanisme','prescription','Prescriptions du PLU','wms',GPF],
 ['Urbanisme','info','Informations du PLU','wms',GPF],
 ['Foncier','BDTOPO-DIFF-ZONE_ACTIVITES','Zones d\'activités (BD TOPO)','wmts','PM_7_18|normal|image/png'],
 ['Foncier','POTENTIEL.SOLAIRE.FRICHE','Friches recensées','wms',GPF],
 ['Risques','PPRN_ZONE_INOND','PPR inondation, zonage réglementaire','wms',GR],
 ['Risques','ALEA_SYNT_01_02MOY','Zones inondables, crue centennale','wms',GR],
 ['Risques','REMNAPPE','Remontées de nappes','wms',GR],
 ['Risques','ALEARG_REALISE','Retrait gonflement des argiles','wms',GR],
 ['Risques','CAVITE_LOCALISEE','Cavités souterraines','wms',GR],
 ['Risques','PPRT_ZONE_RISQIND','PPR technologiques','wms',GR],
 ['Industrie et pollution','INSTALLATIONS_CLASSEES_SIMPLIFIE','Installations classées (ICPE)','wms',GR],
 ['Industrie et pollution','SSP_ETABLISSEMENT','Anciens sites industriels (CASIAS)','wms',GR],
 ['Industrie et pollution','SSP_INSTRUCTION','Sites pollués (ex BASOL)','wms',GR],
 ['Industrie et pollution','SSP_CLASSIFICATION_SIS','Secteurs d\'information sur les sols','wms',GR],
 ['Industrie et pollution','CANALISATIONS','Canalisations de matières dangereuses','wms',GR],
 ['Environnement','Patrinat_ZNIEFF1','ZNIEFF type 1','wmts','PM_6_16|normal|image/png'],
 ['Environnement','Patrinat_ZNIEFF2','ZNIEFF type 2','wmts','PM_6_16|normal|image/png'],
 ['Énergie','POTENTIEL.SOLAIRE.BATIMENT','Potentiel solaire des toitures','wmts','PM_6_18|POTENTIEL.SOLAIRE.BATIMENT|image/png'],
 ['Histoire','ORTHOIMAGERY.ORTHOPHOTOS.1950-1965','Photos aériennes 1950 à 1965','wmts','PM_0_18|BDORTHOHISTORIQUE|image/png'],
 ['Histoire','ORTHOIMAGERY.ORTHOPHOTOS.1980-1995','Photos aériennes 1980 à 1995','wmts','PM_3_18|BDORTHOHISTORIQUE|image/png'],
];
(function(){let g='',h='';PUB.forEach((c,i)=>{if(c[0]!==g){g=c[0];h+=`<div class="grp">${esc(g)}</div>`}h+=`<label class="chk"><input type="checkbox" data-pub="${i}"> ${esc(c[2])}</label>`});$('pub-list').innerHTML=h})();
$('pub-list').addEventListener('change',e=>{const i=e.target.dataset.pub;if(i==null)return;const c=PUB[+i],id='pub-'+i,on=e.target.checked;
  if(on&&!map.getSource(id)){
    let url;if(c[3]==='wms')url=`${c[4]}?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&FORMAT=image/png&TRANSPARENT=true&STYLES=&CRS=EPSG:3857&WIDTH=256&HEIGHT=256&LAYERS=${encodeURIComponent(c[1])}&BBOX={bbox-epsg-3857}`;
    else{const [tms,st,fmt]=c[4].split('|');url=`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${encodeURIComponent(c[1])}&STYLE=${encodeURIComponent(st)}&TILEMATRIXSET=${tms}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=${fmt}`}
    map.addSource(id,{type:'raster',tiles:[url],tileSize:256,attribution:c[3]==='wms'&&c[4]===GR?'© Géorisques':'© IGN'});
    map.addLayer({id,type:'raster',source:id,paint:{'raster-opacity':c[0]==='Histoire'?1:.75}},map.getLayer('bat-f')?'bat-f':undefined);
    return}
  vis(id,on)});

// Couches
$('l-cad').onchange=e=>vis('cad',e.target.checked);
$('l-ortho').onchange=e=>{vis('ortho',e.target.checked);vis('plan',!e.target.checked)};
$('l-etab').onchange=e=>vis('etab',e.target.checked);
$('l-ent').onchange=e=>vis('ent',e.target.checked);
$('l-zon').onchange=async e=>{
  if(e.target.checked&&!map.getSource('zon')){msg('Chargement du zonage…');const z=await rpc('carto_geojson_zonage',{p_code:'37233'});msg('');
    map.addSource('zon',{type:'geojson',data:z});
    map.addLayer({id:'zon-f',type:'fill',source:'zon',paint:{'fill-color':['case',['==',['slice',['coalesce',['get','libelle'],''],0,2],'UX'],'#c2551f','#f2b134'],'fill-opacity':.15}},'bat-f');
    map.addLayer({id:'zon-l',type:'line',source:'zon',paint:{'line-color':'#8a6d1f','line-width':1}},'bat-f');
    return}
  ['zon-f','zon-l'].forEach(l=>vis(l,e.target.checked));
};
$('l-rep').onchange=e=>['rep-f','rep-l','rep-p'].forEach(l=>vis(l,e.target.checked));
const STATUTS_REP=['À qualifier','Propriétaire identifié','Contacté','Mandat','Écarté'];
function openRep(p){
  $('fiche').classList.add('open');
  $('fiche-c').innerHTML=`<h2>${esc(p.nom||'Repérage')}</h2><div style="color:var(--dim)">${esc(nz(p.typ)||'')} ${p.surface?'· '+n0(p.surface)+' m²':''} · repéré le ${esc(p.dt||'')}</div>
  <h3>Suivi</h3><div class="suivi"><select id="r-statut" class="full">${STATUTS_REP.map(x=>`<option${p.statut===x?' selected':''}>${x}</option>`).join('')}</select>
  <input id="r-contact" class="full" placeholder="Contact" value="${esc(nz(p.contact))}">
  <textarea id="r-notes" class="full" rows="4" placeholder="Notes">${esc(nz(p.notes))}</textarea>
  <button class="pri full" onclick="saveRep('${esc(p.id)}')">Enregistrer</button></div>
  <div style="color:var(--dim);font-size:11px;margin-top:10px">Dessin et déplacement des repérages dans QGIS.</div>`;
}
async function saveRep(id){
  const r=await fetch(`${SUPA_URL}/rest/v1/carto_reperages?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...hdr(),'Prefer':'return=minimal'},body:JSON.stringify({statut:$('r-statut').value,contact:$('r-contact').value||null,notes:$('r-notes').value||null})});
  msg(r.ok?'Repérage enregistré':'Erreur '+r.status,1500);
  if(r.ok)map.getSource('t').setTiles([`${SUPA_URL}/rest/v1/rpc/carto_mvt?z={z}&x={x}&y={y}`]);
}
$('toggle').onclick=()=>{$('side').classList.toggle('ferme');setTimeout(()=>map.resize(),220)};

// Fiche
function closeFiche(){$('fiche').classList.remove('open');if(location.hash.startsWith('#bdnb'))history.replaceState(null,'',location.pathname+location.search)}
async function openFiche(id){
  const el=$('fiche-c');$('fiche').classList.add('open');el.innerHTML='<p style="color:var(--dim)">Chargement…</p>';
  let d;try{d=await rpc('carto_fiche_batiment',{p_id:id})}catch(e){el.innerHTML='<p>Erreur de chargement.</p>';return}
  const b=d.batiment||{};
  const kv=rs=>'<div class="kv">'+rs.filter(r=>r[1]!==''&&r[1]!=null&&r[1]!==' m²').map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('')+'</div>';
  const st=d.surface_terrain, emp=d.emprise_totale_sur_terrain, ratio=st&&emp?Math.round(emp/st*100):null;
  let s=await fetch(`${SUPA_URL}/rest/v1/carto_batiments?batiment_groupe_id=eq.${encodeURIComponent(id)}&select=statut_prospection,notes,date_dernier_contact,prochaine_action`,{headers:hdr()}).then(r=>r.json()).then(j=>j[0]||{}).catch(()=>({}));
  let h=`<h2>${esc(b.usage||'Bâtiment')}</h2><div style="color:var(--dim)">${esc(b.adresse||'Adresse non renseignée')}</div>`;
  if(b.priorite)h+=`<div style="margin-top:8px"><span class="tag" style="color:#fff;background:${PCOL[b.priorite]};border:0">Priorité ${b.priorite}</span> ${esc(b.motif||'')}</div>`;
  h+=`<h3>Suivi de prospection</h3><div class="suivi">
    <select id="s-statut" class="full"><option value="">Statut</option>${STATUTS.map(x=>`<option${s.statut_prospection===x?' selected':''}>${x}</option>`).join('')}</select>
    <div><div class="lbl">Dernier contact</div><input id="s-date" type="date" value="${esc(s.date_dernier_contact||'')}"></div>
    <div><div class="lbl">Prochaine action</div><input id="s-action" value="${esc(s.prochaine_action||'')}"></div>
    <textarea id="s-notes" class="full" rows="3" placeholder="Notes">${esc(s.notes||'')}</textarea>
    <button class="pri full" onclick="saveSuivi('${esc(id)}')">Enregistrer le suivi</button></div>`;
  h+='<h3>Bâti</h3>'+kv([['Emprise au sol',n0(b.emprise)+' m²'],['Niveaux',b.niveaux],['Plancher estimé',n0(b.plancher_estime)+' m²'],['Hauteur moyenne',b.hauteur?b.hauteur+' m':''],['Année',b.annee],['DPE',b.dpe],['Aléa argile',b.alea_argile],['Conso élec pro 2020',b.conso_elec_pro_mwh?n0(b.conso_elec_pro_mwh)+' MWh':''],['Monument historique',b.monument_historique]]);
  h+='<h3>Terrain</h3>'+kv([['Surface cadastrale',st?n0(st)+' m²':''],['Emprise bâtie totale',emp?n0(emp)+' m²':''],['Taux d\'emprise',ratio!=null?ratio+' %':''],['Parcelles',(d.parcelles||[]).map(p=>`${esc(p.idu)} (${n0(p.contenance)} m²)`).join('<br>')]]);
  h+='<h3>Propriétaire</h3>'+((b.proprietaires||[]).length?b.proprietaires.map((n,i)=>{const sr=(b.siren||[])[i];return `<div class="occ"><div class="n">${esc(n)}</div><div class="m">${sr?`SIREN ${esc(sr)} · <a href="https://annuaire-entreprises.data.gouv.fr/entreprise/${esc(sr)}" target="_blank">fiche</a> · <a href="https://www.pappers.fr/entreprise/${esc(sr)}" target="_blank">Pappers</a>`:''}</div></div>`}).join(''):'<div style="color:var(--dim)">Personne physique ou non renseigné.</div>');
  h+='<h3>Zonage PLU</h3>'+((d.zonage||[]).length?d.zonage.map(z=>`<span class="tag">${esc(z.libelle)}</span> ${esc(z.libelong||'')}`).join('<br>'):'<div style="color:var(--dim)">Non renseigné</div>');
  h+='<h3>Ventes DVF</h3>'+((d.mutations||[]).length?'<table class="t"><tr><th>Date</th><th>Type</th><th class="r">Bâti</th><th class="r">Valeur</th></tr>'+d.mutations.map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(m.type)}</td><td class="r">${m.surface_bati?n0(m.surface_bati)+' m²':''}</td><td class="r">${m.valeur!=null?n0(m.valeur)+' €':''}</td></tr>`).join('')+'</table>':'<div style="color:var(--dim)">Aucune vente depuis 2021</div>');
  const occ=d.occupants||[];
  h+=`<h3>Occupants (${occ.length})</h3>`+occ.map(o=>{const dir=(o.dirigeants||[]).slice(0,2).map(x=>x.nom?[x.prenoms,x.nom].filter(Boolean).join(' ')+(x.annee_de_naissance?' ('+x.annee_de_naissance+')':''):(x.denomination||'')).filter(Boolean).join(' ; ');
    return `<div class="occ"><div class="n">${esc(o.enseigne||o.nom)} <span class="tag ${o.etat==='A'?'ok':'ko'}">${o.etat==='A'?'actif':'fermé'}</span></div><div class="m">NAF ${esc(o.naf||'')} · effectif ${esc(EFF[o.effectif]||o.effectif||'')} · créé ${esc(o.creation||'')}${dir?'<br>Dirigeants : '+esc(dir):''}<br><a href="https://annuaire-entreprises.data.gouv.fr/etablissement/${esc(o.siret)}" target="_blank">SIRET ${esc(o.siret)}</a></div></div>`}).join('');
  const c=map.getCenter();
  h+=`<h3>Liens</h3><a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${c.lat},${c.lng}" target="_blank">Street View</a> · <a href="https://www.geoportail.gouv.fr/carte?c=${c.lng},${c.lat}&z=18&l0=CADASTRALPARCELS.PARCELLAIRE_EXPRESS::GEOPORTAIL:OGC:WMTS(1)&permalink=yes" target="_blank">Géoportail</a> · <a href="https://www.geoportail-urbanisme.gouv.fr/map/#tile=1&lon=${c.lng}&lat=${c.lat}&zoom=17" target="_blank">Urbanisme</a>`;
  el.innerHTML=h;
  history.replaceState(null,'','#'+id);
}
async function saveSuivi(id){
  const body={statut_prospection:$('s-statut').value||null,notes:$('s-notes').value||null,date_dernier_contact:$('s-date').value||null,prochaine_action:$('s-action').value||null};
  const r=await fetch(`${SUPA_URL}/rest/v1/carto_batiments?batiment_groupe_id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...hdr(),'Prefer':'return=minimal'},body:JSON.stringify(body)});
  if(!r.ok){msg('Erreur d\'enregistrement '+r.status,3000);return}
  msg('Suivi enregistré',1500);
  map.getSource('t').setTiles([`${SUPA_URL}/rest/v1/rpc/carto_mvt?z={z}&x={x}&y={y}`]);
  chercher();
}

map.on('load',async()=>{
  if(!(await auth())){sessionKO();return}
  setInterval(auth,10*60*1000);
  addData();
  chercher();
  const stats=(n)=>rpc('carto_stats',{p_code:'37233'}).then(s=>{$('stat').textContent=`Saint Pierre des Corps · ${n0(s.p1)} P1 · ${n0(s.p2)} P2 · ${n0(s.p3)} P3`}).catch(()=>{if(n)setTimeout(()=>stats(n-1),3000)});
  stats(2);
  const h=location.hash.slice(1);if(h.startsWith('bdnb-'))openFiche(decodeURIComponent(h));
});
</script>
</body>
</html>
